plugins { id 'com.android.application' }

android {
    namespace 'cl.zmremake'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'cl.zmremake'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DBUILD_ANDROID_APP=ON', '-DLIBMGBA_ONLY=ON', '-DSKIP_LIBRARY=ON',
                          '-DM_CORE_GB=OFF', '-DM_CORE_GBA=ON', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }
    externalNativeBuild {
        cmake { path file('../../CMakeLists.txt'); version '3.22.1' }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
